stages:
  - build
  - deploy

variables:
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  IMAGE_PROD_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA-prod"

build:
  image: docker:latest
  stage: build
  variables:
    DOCKER_TLS_CERTDIR: ""
  only:
    refs:
      - prod
  tags:
    - prod
    - pdr-dmg
  environment:
    name: Production
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - docker build -t "$IMAGE_TAG" -t "$IMAGE_PROD_TAG" .
    - docker push $IMAGE_TAG
    - docker push $IMAGE_PROD_TAG
  before_script:
    - |
      cat <<EOF > .env
      NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL
      EOF

deploy:
  stage: deploy
  only:
    refs:
      - prod
  tags:
    - prod
    - shell
  environment:
    name: Production
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - IMAGE_NAME=$IMAGE_TAG docker compose pull
    - IMAGE_NAME=$IMAGE_TAG docker compose up -d
    - docker system prune -fa
